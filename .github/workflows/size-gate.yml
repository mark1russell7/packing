# The size gate of each pull request and of each push to main (k132, docs/BENCH.md "The size gate").
# The job builds packages/packing and bundles a small consumer of each published code export with esbuild.
# The consumer imports one name. The job writes the gzip bytes of each bundle, and fails when one is above its
# budget in bench/gates/size.json, or when an export has no entry. A bundle is deterministic, so one measure decides.
name: Size gate

on:
  # ci.yml calls this workflow, so the check CI OK of the ruleset needs it
  workflow_call:

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gate measures the published files in build/, so it builds them first
      - name: Build the package
        run: pnpm --filter @mark1russell7/packing build
      - name: Apply the size gate
        working-directory: packages/packing
        env:
          OUT: ${{ runner.temp }}/size
        run: |
          status=0
          node bench/main.ts size-gate --gate bench/gates/size.json --out "$OUT" || status=$?
          [ -f "$OUT/size.md" ] && cat "$OUT/size.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: size-gate
          path: ${{ runner.temp }}/size
          retention-days: 90
          if-no-files-found: error
