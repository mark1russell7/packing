# The win test of the promotion rule (docs/BENCH.md, "The win test"). The job time packs one corpus with the candidate
# and the current default on one runner, with the timed runs of each input in alternation. The job promotion downloads
# the records of a bench run and the time records, runs bench/promote.ts with --times, and keeps promotion.json and
# promotion.md as an artifact. A verdict "fail" does not fail the job. Only an error of a tool fails it.
# A pull request runs the guards once on screen 6 (pack-holdout-v1), and the job time on the small corpus smoke-v1.
name: Promotion

on:
  pull_request:
    paths:
      - packages/packing/bench/promote.ts
      - packages/packing/bench/run.ts
      - packages/packing/bench/main.ts
      - .github/workflows/promotion.yml
  workflow_dispatch:
    inputs:
      run:
        description: The bench.yml run id of the records
        required: true
        default: "40662373078"
      corpus:
        description: The corpus of the run. The artifact is bench-<corpus>. The job time packs this corpus again.
        required: true
        default: pack-holdout-v1
      candidate:
        description: The id of the candidate entry
        required: true
        default: maxrects-bl
      default:
        description: The id of the current default entry
        required: false
        default: rows
      win:
        description: The win measures, with commas
        required: false
        default: pack.fill
      repeats:
        description: The timed runs of each pair in the job time. The time is the median.
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIME_CORPUS: ${{ inputs.corpus || 'smoke-v1' }}
      CANDIDATE: ${{ inputs.candidate || 'maxrects-bl' }}
      CURRENT: ${{ inputs.default || 'rows' }}
      REPEATS: ${{ inputs.repeats || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # bench/main.ts imports @mark1russell7/layout-contract at run time
      - run: pnpm install --frozen-lockfile
      - name: Check the inputs
        run: |
          [[ "$TIME_CORPUS" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo "corpus must be a-z, 0-9, dot and hyphen, not '$TIME_CORPUS'"; exit 1; }
          [ -f "packages/packing/bench/corpora/$TIME_CORPUS.json" ] || { echo "packages/packing/bench/corpora/$TIME_CORPUS.json does not exist"; exit 1; }
          [[ "$REPEATS" =~ ^[1-9][0-9]*$ ]] || { echo "repeats must be a number of 1 or more, not '$REPEATS'"; exit 1; }
          node packages/packing/bench/main.ts list --strategies "$CANDIDATE,$CURRENT"
      - name: Time the candidate and the default on this runner
        run: |
          out="$RUNNER_TEMP/time"
          start=$SECONDS
          status=0
          node packages/packing/bench/main.ts run --corpus "$TIME_CORPUS" --prediction promotion-time \
            --strategies "$CANDIDATE,$CURRENT" --interleave --repeats "$REPEATS" --warmup 1 --out "$out" || status=$?
          if [ -f "$out/run.json" ]; then
            cpu="$(jq -r '"\(.env.cpus) x \(.env.cpu)"' "$out/run.json")"
            echo "The job time packed \`$TIME_CORPUS\` with \`$CANDIDATE\` and \`$CURRENT\` on one runner ($cpu) in $((SECONDS - start)) s." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: promotion-time-${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/time
          if-no-files-found: error

  promotion:
    needs: time
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      RECORDS_RUN: ${{ inputs.run || '40662373078' }}
      CORPUS: ${{ inputs.corpus || 'pack-holdout-v1' }}
      CANDIDATE: ${{ inputs.candidate || 'maxrects-bl' }}
      CURRENT: ${{ inputs.default || 'rows' }}
      WIN: ${{ inputs.win || 'pack.fill' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the records of the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$RECORDS_RUN" -R "$GITHUB_REPOSITORY" -n "bench-$CORPUS" -D "$RUNNER_TEMP/records"
      - name: Download the time records of the job time
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promotion-time-${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/time
      - name: Run the win test
        working-directory: packages/packing
        run: node bench/promote.ts "$RUNNER_TEMP/records" --candidate "$CANDIDATE" --default "$CURRENT" --win "$WIN" --times "$RUNNER_TEMP/time" --out "$RUNNER_TEMP/promotion"
      - name: Write the verdict to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/promotion/promotion.md" ]; then
            cat "$RUNNER_TEMP/promotion/promotion.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: promotion-${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/promotion
