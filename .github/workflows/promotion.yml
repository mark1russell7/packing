# The win test of the promotion rule (docs/BENCH.md, "The win test"). It downloads the records of a bench run, runs
# bench/promote.ts on a candidate and the current default, and keeps promotion.json and promotion.md as an artifact.
# A verdict "fail" does not fail the job. Only an error of the tool fails it. A pull request runs it once on screen 6.
name: Promotion

on:
  pull_request:
    paths:
      - packages/packing/bench/promote.ts
      - .github/workflows/promotion.yml
  workflow_dispatch:
    inputs:
      run:
        description: The bench.yml run id of the records
        required: true
        default: "40662373078"
      corpus:
        description: The corpus of the run. The artifact is bench-<corpus>.
        required: true
        default: pack-holdout-v1
      candidate:
        description: The id of the candidate entry
        required: true
        default: maxrects-bl
      default:
        description: The id of the current default entry
        required: false
        default: rows
      win:
        description: The win measures, with commas
        required: false
        default: pack.fill

permissions:
  contents: read

jobs:
  promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      RECORDS_RUN: ${{ inputs.run || '40662373078' }}
      CORPUS: ${{ inputs.corpus || 'pack-holdout-v1' }}
      CANDIDATE: ${{ inputs.candidate || 'maxrects-bl' }}
      CURRENT: ${{ inputs.default || 'rows' }}
      WIN: ${{ inputs.win || 'pack.fill' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the records of the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$RECORDS_RUN" -R "$GITHUB_REPOSITORY" -n "bench-$CORPUS" -D "$RUNNER_TEMP/records"
      - name: Run the win test
        working-directory: packages/packing
        run: node bench/promote.ts "$RUNNER_TEMP/records" --candidate "$CANDIDATE" --default "$CURRENT" --win "$WIN" --out "$RUNNER_TEMP/promotion"
      - name: Write the verdict to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/promotion/promotion.md" ]; then
            cat "$RUNNER_TEMP/promotion/promotion.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: promotion-${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/promotion
