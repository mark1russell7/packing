# The predicate dump of A13 of algebra (docs/BENCH.md, "Predicate dump"). Each job of the matrix packs the corpus one time
# with one entry, with the probe of src/probe.ts on. It keeps the near inputs of the float predicates as JSON lines.
# The job merge joins the files of all entries into the artifact predicates-<corpus>. The dump does not time.
name: Predicates

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: "The corpus: a file of packages/packing/bench/corpora, without .json."
        type: string
        default: pack-select-v2
      strategies:
        description: "The entries, with commas, or all. bench/entries.ts lists them."
        type: string
        default: all

permissions:
  contents: read

# The runner budget of the account (strategist, 2026-10-30). The group has the inputs, so only a true duplicate replaces a run that waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.corpus }}-${{ inputs.strategies }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      strategies: ${{ steps.plan.outputs.strategies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the inputs and plan the matrix
        id: plan
        env:
          CORPUS: ${{ inputs.corpus }}
          STRATEGIES: ${{ inputs.strategies }}
        run: |
          [[ "$CORPUS" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo "corpus must be a-z, 0-9, dot and hyphen, not '$CORPUS'"; exit 1; }
          [ -f "packages/packing/bench/corpora/$CORPUS.json" ] || { echo "packages/packing/bench/corpora/$CORPUS.json does not exist"; exit 1; }
          list=$(node packages/packing/bench/main.ts list --strategies "$STRATEGIES")
          echo "strategies=$list" >> "$GITHUB_OUTPUT"
          echo "The strategies: $list"

  dump:
    needs: plan
    name: dump (${{ matrix.strategy }})
    runs-on: ubuntu-latest
    # The probe makes each predicate call slower. ruin-recreate-skyline-k64 on pack-select-v2 needs more than 60 minutes (run 41547266012).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        strategy: ${{ fromJSON(needs.plan.outputs.strategies) }}
    env:
      CORPUS: ${{ inputs.corpus }}
      STRATEGY: ${{ matrix.strategy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dump the near predicate inputs
        run: node packages/packing/bench/main.ts predicates --corpus "$CORPUS" --strategies "$STRATEGY" --out "$RUNNER_TEMP/predicates/$STRATEGY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: predicates-${{ inputs.corpus }}-${{ matrix.strategy }}
          path: ${{ runner.temp }}/predicates
          if-no-files-found: error

  merge:
    needs: dump
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORPUS: ${{ inputs.corpus }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: predicates-${{ inputs.corpus }}-*
          path: ${{ runner.temp }}/parts
          merge-multiple: true
      - name: Join the files of the entries
        run: |
          out="$RUNNER_TEMP/predicates-$CORPUS"
          mkdir -p "$out"
          for dir in $(ls -d "$RUNNER_TEMP"/parts/*/ | sort); do cat "$dir/predicates.jsonl" >> "$out/predicates.jsonl"; done
          node -e '
            const fs = require("node:fs");
            const [file, corpus] = process.argv.slice(1);
            const sum = { cases: 0, totals: {}, near: {}, touch: {}, lines: 0 };
            for (const line of fs.readFileSync(file, "utf8").split("\n")) {
              if (line === "") continue;
              const x = JSON.parse(line);
              if (x.fn !== undefined) continue;
              sum.cases += 1;
              sum.lines += x.lines;
              for (const k of ["totals", "near", "touch"]) for (const [fn, n] of Object.entries(x[k])) sum[k][fn] = (sum[k][fn] ?? 0) + n;
            }
            fs.writeFileSync(file.replace(/predicates\.jsonl$/, "summary.json"), JSON.stringify({ corpus, ...sum }, null, 2) + "\n");
            console.log(JSON.stringify({ corpus, ...sum }));
          ' "$out/predicates.jsonl" "$CORPUS" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: predicates-${{ inputs.corpus }}
          path: ${{ runner.temp }}/predicates-${{ inputs.corpus }}
          if-no-files-found: error
