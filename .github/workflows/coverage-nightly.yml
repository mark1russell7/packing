# The control test of the active draw against a control arm (k120, docs/BENCH.md "The nightly control").
# The job grid packs the corpus with bench.yml and no sample. The jobs sample pack the held-out sample in shards,
# and the job held-out joins them. The merge fails on a missing pair. Each job arm draws one arm with one fold seed.
# The job verdict gives the paired test of each fold seed and the result over the fold seeds.
# The jobs go one after the other: grid, sample, held-out, arm, verdict. Each group has max-parallel 3, so a run holds 3 slots at most.
# A failed grid stops the arms and not the sample, and a failed shard stops held-out and not the arms.
# Its prediction is packing-k161-weekly-budget, after packing-k120-nightly. A change of the inputs needs a new prediction first.
#
# The grid has a wall budget for each pair and a job limit of 130 minutes, so a slow entry keeps the rows that it finished.
# Its pairs stop at 120 minutes. That is the limit that cut raster-nofit with no row in run 41949891960.
# With the old limit of 30 minutes, near-rects (42 minutes in that run) and raster-nofit fail the grid, and the arms do not start.
# A scheduled run also starts site-data.yml, which writes the next point of the coverage trend.
#
# Each arm has a work budget: ROUNDS rounds of SAMPLE / ROUNDS pairs, the same for both arms. Thus a cell is the same on
# each runner. MAX_MINUTES is only a timeout: an arm that it stops voids its cell (bench/nightly-plan.ts cells).
# The same seeds and the same code give the same result. Thus the workflow starts each week as the control, and by a manual
# start. A push does not start it: a grid of about 3 hours does not start from a merge, past the check of the free CI slots.
# So a change of the files of the draw or the verdict shows in the next Monday run, or in a manual run that a person starts.
# The record cells.json has the commit.
name: Coverage nightly

on:
  schedule:
    - cron: "52 2 * * 1"
  workflow_dispatch:
    inputs:
      corpus:
        description: "The corpus of the grid: a file of packages/packing/bench/corpora, without .json."
        type: string
        default: pack-classes-v1
      sample:
        description: "The pairs of the held-out sample, and the pairs of each arm."
        type: string
        default: "400"
      shards:
        description: "The jobs of the held-out sample, 1 to 16. Each job packs one block of the pairs."
        type: string
        default: "4"
      seeds:
        description: "The fold seeds, as a JSON list of 5 or more whole numbers."
        type: string
        default: "[1, 2, 3, 4, 5]"

permissions:
  contents: read

concurrency:
  # A weekly run and a manual run have different groups, so one does not hold the other. No run cancels another.
  group: coverage-nightly-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

# The shell bash has pipefail, so a failure before a tee fails the step.
defaults:
  run:
    shell: bash

env:
  # A schedule has no inputs, so each value has its default here too.
  CORPUS: ${{ inputs.corpus || 'pack-classes-v1' }}
  SAMPLE: ${{ inputs.sample || '400' }}
  SHARDS: ${{ inputs.shards || '4' }}
  # The work budget of an arm, and the timeout that voids its cell. docs/BENCH.md has the source of the timeout.
  ROUNDS: "4"
  MAX_MINUTES: "40"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      seeds: ${{ steps.plan.outputs.seeds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the inputs
        id: plan
        env:
          SEEDS: ${{ inputs.seeds || '[1, 2, 3, 4, 5]' }}
        run: |
          [[ "$CORPUS" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo "corpus must be a-z, 0-9, dot and hyphen, not '$CORPUS'"; exit 1; }
          [[ "$SAMPLE" =~ ^[1-9][0-9]*$ ]] || { echo "sample must be a number of 1 or more, not '$SAMPLE'"; exit 1; }
          node packages/packing/bench/nightly-plan.ts plan --seeds "$SEEDS" --shards "$SHARDS" >> "$GITHUB_OUTPUT"

  grid:
    needs: plan
    uses: ./.github/workflows/bench.yml
    with:
      corpus: ${{ inputs.corpus || 'pack-classes-v1' }}
      prediction: packing-k161-weekly-budget
      sample: "0"
      job-minutes: "130"
      budget: true

  sample:
    needs: [plan, grid]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: sample (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Without a time limit, each pair of the shard finishes. The merge fails on a shard that the time limit stopped.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack one shard of the held-out sample
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node packages/packing/bench/sample-space.ts --out "$RUNNER_TEMP/shard" --n "$SAMPLE" --seed 1 --draw uniform --timing off \
            --shard "$SHARD/$SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error

  held-out:
    needs: sample
    if: ${{ !cancelled() && needs.sample.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-shard-*
          path: ${{ runner.temp }}/shards
      - name: Join the shards
        run: |
          # With one artifact, download-artifact puts its files in shards itself, not in shards/<name>
          mapfile -t parts < <(find "$RUNNER_TEMP/shards" -name sample.json -printf '%h\n' | sort -V)
          node packages/packing/bench/sample-space.ts merge --out "$RUNNER_TEMP/held-out" "${parts[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-held-out
          path: ${{ runner.temp }}/held-out
          if-no-files-found: error

  arm:
    needs: [plan, grid, held-out]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.grid.result == 'success' }}
    name: arm (${{ matrix.arm }}, ${{ matrix.seed }})
    runs-on: ubuntu-latest
    # The timeout MAX_MINUTES stops the rounds, and the fits of the rounds take some minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
        arm: [active, control]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-${{ env.CORPUS }}
          path: ${{ runner.temp }}/grid
      - name: Draw one arm with one fold seed
        env:
          ARM: ${{ matrix.arm }}
          FOLD_SEED: ${{ matrix.seed }}
        run: |
          grid="$RUNNER_TEMP/grid"
          node packages/packing/bench/active.ts --out "$RUNNER_TEMP/arm" --records "$grid/records.jsonl" --corpus "$grid/corpus.json" \
            --n "$SAMPLE" --seed 1 --rounds "$ROUNDS" --max-minutes "$MAX_MINUTES" --features family --arm "$ARM" --fold-seed "$FOLD_SEED" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-arm-${{ matrix.arm }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/arm
          if-no-files-found: error

  verdict:
    needs: [plan, held-out, arm]
    # A failed arm voids only its cell. The command cells fails when fewer than 5 cells are left.
    if: ${{ !cancelled() && needs.held-out.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-${{ env.CORPUS }}
          path: ${{ runner.temp }}/grid
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-held-out
          path: ${{ runner.temp }}/held-out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-arm-*
          path: ${{ runner.temp }}/arms
      - name: The paired test of each fold seed, and the result over the fold seeds
        env:
          SEEDS: ${{ needs.plan.outputs.seeds }}
          EVENT: ${{ github.event_name }}
        run: |
          grid="$RUNNER_TEMP/grid"
          out="$RUNNER_TEMP/verdict"
          mkdir -p "$out"
          run_date="$(date -u +%Y-%m-%d)"
          live=$(node packages/packing/bench/nightly-plan.ts cells --arms "$RUNNER_TEMP/arms" --seeds "$SEEDS" --out "$out/cells.json" \
            --commit "$GITHUB_SHA" --event "$EVENT")
          files=()
          for seed in $live; do
            node packages/packing/bench/coverage.ts --records "$grid/records.jsonl" --corpus "$grid/corpus.json" \
              --out "$out/coverage-$seed.json" --by spec --run "$GITHUB_RUN_ID" --date "$run_date" --min-records 50 --features family \
              --sample "$RUNNER_TEMP/held-out" --active "$RUNNER_TEMP/arms/nightly-arm-active-$seed" \
              --control "$RUNNER_TEMP/arms/nightly-arm-control-$seed" > "$out/coverage-$seed.txt"
            files+=("$out/coverage-$seed.json")
          done
          {
            echo "### The result over the fold seeds"
            echo '```'
            node packages/packing/bench/paired-arms.ts --out "$out/fold.json" "${files[@]}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-verdict
          path: ${{ runner.temp }}/verdict
          if-no-files-found: error
