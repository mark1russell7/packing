# The check of the treemaps against Tables I to III of Bederson, Shneiderman, Wattenberg 2002 (docs/BENCH.md, "Treemaps
# against the literature"). The job repeats the Monte Carlo trials of the paper on made-up data. The output is a report,
# not a gate, so no pull request starts this workflow. The bench reads no clock, so its bytes do not depend on the runner.
name: Treemap literature

on:
  workflow_dispatch:
    inputs:
      trials:
        description: The number of trials. The paper has 100.
        required: false
        default: "100"
      steps:
        description: The number of steps of each trial. The paper has 100.
        required: false
        default: "100"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TRIALS: ${{ inputs.trials }}
      STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare the treemaps with the published tables
        working-directory: packages/packing
        run: node bench/treemap-literature.ts --trials "$TRIALS" --steps "$STEPS" --out "$RUNNER_TEMP/treemap-literature" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: treemap-literature
          path: ${{ runner.temp }}/treemap-literature
