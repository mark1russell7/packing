# The check of the per-cell portfolio table (docs/BENCH.md). It downloads the records of the bench run that the table
# names, runs bench/choose-sets.ts on them and compares the result with src/portfolio-sets.ts. The job fails when the
# committed table is not the output of its generator. The generated file is an artifact, so a pull request can take it.
name: Portfolio sets

on:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  workflow_dispatch:
    inputs:
      run:
        description: The bench.yml run id of the records
        required: false
        default: "40652567756"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@e5528b40a615db0f2e0f341c5ec0fa860ca47cc0 # main
        with:
          paths: |
            packages/packing/bench/choose-sets.ts
            packages/packing/bench/gate-flip.ts
            packages/packing/bench/portfolio.ts
            packages/packing/src/portfolio-cell.ts
            packages/packing/src/portfolio-sets.ts
            .github/workflows/portfolio-sets.yml

  sets:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      RECORDS_RUN: ${{ inputs.run || '40652567756' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the records of the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$RECORDS_RUN" -R "$GITHUB_REPOSITORY" -n bench-pack-screen-v1 -D "$RUNNER_TEMP/records"
      - name: Generate the table
        working-directory: packages/packing
        run: node bench/choose-sets.ts "$RUNNER_TEMP/records" --run "$RECORDS_RUN" --out "$RUNNER_TEMP/portfolio-sets.ts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: portfolio-sets
          path: ${{ runner.temp }}/portfolio-sets.ts
      - name: Compare the generated table with the committed table
        run: diff -u packages/packing/src/portfolio-sets.ts "$RUNNER_TEMP/portfolio-sets.ts"
      # A clean copy of the records gives no difference, and a copy with no records of a chosen strategy gives one
      - name: Flip test of the comparison
        working-directory: packages/packing
        run: node bench/gate-flip.ts portfolio --records "$RUNNER_TEMP/records" --run "$RECORDS_RUN" --committed src/portfolio-sets.ts --out "$RUNNER_TEMP/portfolio-flip"

  portfolio-sets-ok:
    name: Portfolio sets OK
    if: ${{ !cancelled() }}
    needs: [changes, sets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@e5528b40a615db0f2e0f341c5ec0fa860ca47cc0 # main
        with:
          needs: ${{ toJSON(needs) }}
