# The CI of this repository. The job ci is the shared CI of mark1russell7 (reusable-ci.yml, CI.md)
# with its default inputs: it runs each standard script that package.json has (format:check,
# typecheck, lint, check:conventions, test, build in each package that has it, check:boundaries, check:api and lint:ste).
name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@e077054e0f2ebb8441e4bc525b56cf2acc2afb6f # main

  # The gate jobs of this repository: the smoke run of the benchmark, the render of the site and the time gates
  bench-smoke:
    uses: ./.github/workflows/bench-smoke.yml
    permissions:
      contents: read

  # The job verify of release.yml uses this workflow with only `contents: read`. A job that asks for more stops each release
  # before it starts (bench/release-permissions.test.ts).
  site-check:
    uses: ./.github/workflows/site-check.yml
    permissions:
      contents: read

  # The size gate of the published exports (k132): the gzip bytes of a small consumer of each, against a budget.
  size-gate:
    uses: ./.github/workflows/size-gate.yml
    permissions:
      contents: read

  # The output rows of the catalog (k150): a read of each option set, against src/strategy-output.ts.
  output-rows:
    uses: ./.github/workflows/output-rows.yml
    permissions:
      contents: read

  # The time gates of bench/gates (k130). A pull request runs them only when a file of the gates changed.
  skyline-equal:
    uses: ./.github/workflows/skyline-equal.yml
    permissions:
      contents: read

  time-gate:
    uses: ./.github/workflows/time-gate.yml
    permissions:
      contents: read

  # The hold of the corpus pack-adversary-v1. A pull request runs the search only when a file of the search or a strategy changed.
  adversary:
    uses: ./.github/workflows/adversary.yml
    permissions:
      contents: read

  # Each preset of `pnpm package add` makes a package, and that package passes its typecheck and its tests.
  # The tests of the preset service hold its entry to describe() and lint() of @mark1russell7/service (OTH-5).
  # A test of the CLI compares this list with the presets of the CLI.
  # Only the template has the source of the CLI (packages/cli), so a repository from new-repo.ps1 skips this job.
  presets:
    if: github.repository == 'mark1russell7/template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        preset: [node, node-cjs, ts, vite, react, service]
    env:
      PACKAGE: demo-${{ matrix.preset }}
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package add "$PACKAGE" --preset="$PRESET"
      # The new package changes the lockfile
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter "@template/$PACKAGE" typecheck
      - run: pnpm --filter "@template/$PACKAGE" test

  # The one check that the ruleset names (template CI.md, "The check of the ruleset"). It needs each job of this file.
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [ci, bench-smoke, site-check, size-gate, skyline-equal, output-rows, time-gate, adversary, presets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          ALLOW_SKIP: "presets"
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
