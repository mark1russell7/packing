# The comparison of roadmap item k94 (docs/BENCH.md, "Circles in a circle against the literature"). The job fetches the two best-known
# tables of Packomania, because the repository does not keep them. It packs both families and keeps the records as the artifact circles-<sha>.
# The job writes the table of the gaps to the job summary. It fails only on an exact break: an overlap, a circle outside or two different outputs.
name: Circles

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: The counts of the circles, with commas
        required: true
        default: 10,20,30,50,100
      seeds:
        description: The count of the seeds of each case, from seed 1
        required: true
        default: "5"
      iterations:
        description: The count of the moves of each pack
        required: true
        default: "2000"

permissions:
  contents: read

# The group has the inputs, so only a true duplicate waits for a run that is in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.sizes }}-${{ inputs.seeds }}-${{ inputs.iterations }}
  cancel-in-progress: false

jobs:
  circles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIZES: ${{ inputs.sizes || '10,20,30,50,100' }}
      SEEDS: ${{ inputs.seeds || '5' }}
      ITERATIONS: ${{ inputs.iterations || '2000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # bench/circles.ts imports @mark1russell7/rigor-statistics at run time
      - run: pnpm install --frozen-lockfile
      - name: Check the inputs
        run: |
          [[ "$SIZES" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "sizes must be whole numbers with commas, not '$SIZES'"; exit 1; }
          [[ "$SEEDS" =~ ^[0-9]+$ ]] || { echo "seeds must be a whole number, not '$SEEDS'"; exit 1; }
          [[ "$ITERATIONS" =~ ^[0-9]+$ ]] || { echo "iterations must be a whole number, not '$ITERATIONS'"; exit 1; }
      - name: Fetch the best-known tables of Packomania
        run: |
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/equal.txt" https://www.packomania.com/cci/txt/ratio.txt
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/unit.txt" https://www.packomania.com/ccin/txt/ratio.txt
          # The tables change when a better packing arrives, so the summary keeps the hash of each one. The artifact keeps only the rows of the cases.
          (cd "$RUNNER_TEMP" && sha256sum equal.txt unit.txt) >> "$GITHUB_STEP_SUMMARY"
      - name: Pack both families
        working-directory: packages/packing
        run: |
          status=0
          node bench/circles.ts --equal "$RUNNER_TEMP/equal.txt" --unit "$RUNNER_TEMP/unit.txt" \
            --sizes "$SIZES" --seeds "$SEEDS" --iterations "$ITERATIONS" --out bench-out/circles || status=$?
          cat bench-out/circles/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: circles-${{ github.sha }}
          path: packages/packing/bench-out/circles
          if-no-files-found: warn
