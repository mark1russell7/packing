# The benchmarks of the packer (docs/BENCH.md). Only a person starts a run, after a commit adds its prediction.
# The job plan checks the inputs and gives the matrix of the entries (bench/entries.ts): each strategy of the registry,
# then the variants of the shelf family. Each job of the matrix packs the corpus
# with one entry and keeps its records as the artifact bench-<corpus>-<strategy>. The job merge joins them
# into the artifact bench-<corpus>: the records of all strategies and one summary.
# Only the times of these jobs count. No benchmark runs on a local computer.
name: Bench

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: "The corpus: a file of packages/packing/bench/corpora, without .json."
        type: string
        default: smoke-v1
      strategies:
        description: "The entries, with commas, or all. bench/entries.ts lists them."
        type: string
        default: all
      prediction:
        description: "The id of the prediction of the run. A commit adds the prediction before the run."
        type: string
        required: true
      repeats:
        description: "The timed runs of each pair of a strategy and an input. The time is the median."
        type: string
        default: "5"
      warmup:
        description: "The runs before the timed runs of each pair."
        type: string
        default: "2"
      sample:
        description: "The random pairs of a config and an input for the coverage of the whole space (k112). 0 turns it off."
        type: string
        default: "400"
      anchor:
        description: "Add the measures pack.anchor.* of k111 to each input with a locked item. They need more packs."
        type: boolean
        default: false
      stratify:
        description: "Draw the same count of sampled pairs for each stratum: a strategy family with one count of members (k115)."
        type: boolean
        default: false
      draw:
        description: "The draw of the sampled pairs (k116). active measures the sample first, then 4 active rounds. stratify true is the same as stratified."
        type: choice
        options: [uniform, option, stratified, active]
        default: uniform
      features:
        description: "The features of the inputs for the coverage model (k116): family, or input for the features of each input."
        type: choice
        options: [family, input]
        default: family
      pairs:
        description: "Only these sample pairs, by index, for example 16 or 16,20 (k121). Each pair packs repeats times. Empty means each pair."
        type: string
        default: ""
      timing:
        description: "The clock limits of the sample (k121): off has none, stratum adds the stratum clock:1, mixed is the draw before k121."
        type: choice
        options: ["off", stratum, mixed]
        default: "off"

permissions:
  contents: read

# The runner budget of the account (strategist, 2026-10-30): one bench for each ref, and 3 jobs of its matrix at one time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      strategies: ${{ steps.plan.outputs.strategies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # Since 0.2.0, the strategy list imports @mark1russell7/layout-contract at run time
      - run: pnpm install --frozen-lockfile
      - name: Check the inputs and plan the matrix
        id: plan
        env:
          CORPUS: ${{ inputs.corpus }}
          STRATEGIES: ${{ inputs.strategies }}
          PREDICTION: ${{ inputs.prediction }}
          REPEATS: ${{ inputs.repeats }}
          WARMUP: ${{ inputs.warmup }}
          SAMPLE: ${{ inputs.sample }}
          STRATIFY: ${{ inputs.stratify }}
          DRAW: ${{ inputs.draw }}
          FEATURES: ${{ inputs.features }}
          PAIRS: ${{ inputs.pairs }}
          TIMING: ${{ inputs.timing }}
        run: |
          [[ "$CORPUS" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo "corpus must be a-z, 0-9, dot and hyphen, not '$CORPUS'"; exit 1; }
          [[ "$SAMPLE" =~ ^[0-9]+$ ]] || { echo "sample must be a number of 0 or more, not '$SAMPLE'"; exit 1; }
          [[ "$DRAW" =~ ^(uniform|option|stratified|active)$ ]] || { echo "draw must be uniform, option, stratified or active, not '$DRAW'"; exit 1; }
          [[ "$FEATURES" =~ ^(family|input)$ ]] || { echo "features must be family or input, not '$FEATURES'"; exit 1; }
          # k116: stratify true goes with the draw uniform (the old default), stratified or active. With active, it stratifies the sample.
          if [ "$STRATIFY" = "true" ] && [ "$DRAW" = "option" ]; then echo "stratify true does not go with the draw option"; exit 1; fi
          if [ "$DRAW" = "active" ] && [ "$SAMPLE" -eq 0 ]; then echo "the draw active needs a sample above 0"; exit 1; fi
          # k121: pairs is a list of pair indexes with commas. timing stratum needs a stratified sample. The active draw has no clock limits.
          [[ "$PAIRS" =~ ^([0-9]+(,[0-9]+)*)?$ ]] || { echo "pairs must be numbers with commas, for example 16,20, not '$PAIRS'"; exit 1; }
          [[ "$TIMING" =~ ^(off|stratum|mixed)$ ]] || { echo "timing must be off, stratum or mixed, not '$TIMING'"; exit 1; }
          if [ -n "$PAIRS" ] && [ "$SAMPLE" -eq 0 ]; then echo "pairs needs a sample above 0"; exit 1; fi
          if [ -n "$PAIRS" ] && [ "$DRAW" = "active" ]; then echo "pairs does not go with the draw active"; exit 1; fi
          if [ "$TIMING" != "off" ] && [ "$DRAW" = "active" ]; then echo "the draw active takes only timing off"; exit 1; fi
          if [ "$TIMING" = "stratum" ] && [ "$DRAW" != "stratified" ] && [ "$STRATIFY" != "true" ]; then echo "timing stratum needs the draw stratified"; exit 1; fi
          [ -f "packages/packing/bench/corpora/$CORPUS.json" ] || { echo "packages/packing/bench/corpora/$CORPUS.json does not exist"; exit 1; }
          [[ "$PREDICTION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "prediction must be A-Z, a-z, 0-9, dot, underscore and hyphen, not '$PREDICTION'"; exit 1; }
          [[ "$REPEATS" =~ ^[1-9][0-9]*$ ]] || { echo "repeats must be a number of 1 or more, not '$REPEATS'"; exit 1; }
          [[ "$WARMUP" =~ ^[0-9]+$ ]] || { echo "warmup must be a number of 0 or more, not '$WARMUP'"; exit 1; }
          list=$(node packages/packing/bench/main.ts list --strategies "$STRATEGIES")
          echo "strategies=$list" >> "$GITHUB_OUTPUT"
          echo "The strategies: $list"

  run:
    needs: plan
    name: run (${{ matrix.strategy }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        strategy: ${{ fromJSON(needs.plan.outputs.strategies) }}
    env:
      CORPUS: ${{ inputs.corpus }}
      STRATEGY: ${{ matrix.strategy }}
      PREDICTION: ${{ inputs.prediction }}
      REPEATS: ${{ inputs.repeats }}
      WARMUP: ${{ inputs.warmup }}
      ANCHOR: ${{ inputs.anchor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the benchmark
        run: |
          out="$RUNNER_TEMP/bench/$STRATEGY"
          start=$SECONDS
          status=0
          pnpm --filter @mark1russell7/packing bench run --corpus "$CORPUS" --strategies "$STRATEGY" \
            --prediction "$PREDICTION" --repeats "$REPEATS" --warmup "$WARMUP" --out "$out" \
            $([ "$ANCHOR" = "true" ] && echo --anchor) || status=$?
          if [ -f "$out/summary.md" ]; then
            {
              cat "$out/summary.md"
              echo
              echo "The job ran the benchmark in $((SECONDS - start)) s."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ inputs.corpus }}-${{ matrix.strategy }}
          path: ${{ runner.temp }}/bench/${{ matrix.strategy }}
          if-no-files-found: error

  merge:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    # The sample of the whole space (k112) stops after 25 minutes. With the draw active (k116), the sample and the rounds
    # stop after 12 minutes each, and the fits of the rounds take some minutes. The merge and the coverage take some seconds.
    timeout-minutes: 40
    env:
      CORPUS: ${{ inputs.corpus }}
      SAMPLE: ${{ inputs.sample }}
      STRATIFY: ${{ inputs.stratify }}
      DRAW: ${{ inputs.draw }}
      FEATURES: ${{ inputs.features }}
      PAIRS: ${{ inputs.pairs }}
      TIMING: ${{ inputs.timing }}
      REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # Since 0.2.0, bench/main.ts imports @mark1russell7/layout-contract at run time
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-${{ inputs.corpus }}-*
          path: ${{ runner.temp }}/parts
      - name: Merge the records of the strategies
        run: |
          out="$RUNNER_TEMP/merged"
          status=0
          # With one artifact, download-artifact puts its files in parts itself, not in parts/<name>
          mapfile -t parts < <(find "$RUNNER_TEMP/parts" -name run.json -printf '%h/\n' | sort)
          node packages/packing/bench/main.ts merge --out "$out" "${parts[@]}" || status=$?
          [ -f "$out/summary.md" ] && cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # k105: the space coverage of the merged records, with the folds by spec. It takes some seconds.
      # A run with fewer than 50 measured records gives a note in coverage.json.
      # k112: with sample above 0, the sampler packs that many random pairs into merged/sample first.
      # The coverage then adds the held-out test of the grid on those pairs. An error of the sampler fails the step.
      - name: Compute the space coverage
        if: always()
        run: |
          out="$RUNNER_TEMP/merged"
          if [ ! -f "$out/records.jsonl" ] || [ ! -f "$out/corpus.json" ]; then
            echo "The merged folder has no records.jsonl or corpus.json. The coverage is not computed."
            exit 0
          fi
          run_date="$(date -u +%Y-%m-%d)"
          status=0
          sample=()
          active=()
          # k115: with stratify, each stratum gets the same count of pairs.
          # k116: the draw active measures the sample first (uniform, or stratified with stratify), then the active rounds.
          draw="$DRAW"
          if [ "$STRATIFY" = "true" ] && [ "$draw" = "uniform" ]; then draw=stratified; fi
          sample_draw="$draw"
          minutes=25
          if [ "$draw" = "active" ]; then
            sample_draw=uniform
            if [ "$STRATIFY" = "true" ]; then sample_draw=stratified; fi
            minutes=12
          fi
          # k121: timing gives the clock limits of the sample. pairs measures only those pairs, each one repeats times.
          chosen=()
          if [ -n "$PAIRS" ]; then chosen=(--pairs "$PAIRS" --repeats "$REPEATS"); fi
          if [ "$SAMPLE" -gt 0 ]; then
            node packages/packing/bench/sample-space.ts --out "$out/sample" --n "$SAMPLE" --seed 1 --max-minutes "$minutes" --draw "$sample_draw" \
              --timing "$TIMING" "${chosen[@]}" > "$RUNNER_TEMP/sample.txt" 2>&1 || status=$?
            if [ -f "$out/sample/records.jsonl" ]; then sample=(--sample "$out/sample"); fi
          fi
          if [ "$draw" = "active" ]; then
            node packages/packing/bench/active.ts --out "$out/active" --records "$out/records.jsonl" --corpus "$out/corpus.json" \
              --n "$SAMPLE" --seed 1 --max-minutes 12 --features "$FEATURES" >> "$RUNNER_TEMP/sample.txt" 2>&1 || status=$?
            if [ -f "$out/active/records.jsonl" ]; then active=(--active "$out/active"); fi
          fi
          node packages/packing/bench/coverage.ts --records "$out/records.jsonl" --corpus "$out/corpus.json" \
            --out "$out/coverage.json" --by spec --run "$GITHUB_RUN_ID" --date "$run_date" --min-records 50 --features "$FEATURES" \
            "${sample[@]}" "${active[@]}" > "$RUNNER_TEMP/coverage.txt" 2>&1 || status=$?
          {
            echo "### The space coverage (folds by spec)"
            echo '```'
            cat "$RUNNER_TEMP/coverage.txt"
            echo '```'
            if [ -f "$RUNNER_TEMP/sample.txt" ]; then
              echo "### The sample of the whole space"
              echo '```'
              cat "$RUNNER_TEMP/sample.txt"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ inputs.corpus }}
          path: ${{ runner.temp }}/merged
          if-no-files-found: error
