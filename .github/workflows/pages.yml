# Builds packages/site and publishes it to GitHub Pages at https://mark1russell7.github.io/packing/, with
# the shared Pages workflow of mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  # A merge that changes a version starts the workflow Release. The tag comes at the end of that workflow, and a tag made with
  # the Actions token starts no workflow. So a second build starts when Release ends, and the news shows the new release.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  # One build each day, so the Status page shows the open pull requests and the data date of the day
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  pull_request:

permissions: {}

# One deployment at a time. A newer push waits until the deployment in progress finishes.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@10b3cb8311b894311f86a0ac975f0a047e969f82 # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      # The branch site-data holds the measured files of the latest runs (site-data.yml, docs/BENCH.md "The snapshots of the site").
      # The file releases.json comes from the changelog and the tags at each build, so the news follows each release.
      # They replace the files of main. Without the branch, the build keeps the files of main, and the freshness gate reads their age.
      build: |
        if git fetch -q origin site-data; then git archive FETCH_HEAD | tar -x -C packages/site/data; fi
        (cd packages/packing && node --no-warnings bench/snapshot.ts releases)
        pnpm --filter @packing/site run build
      out: packages/site/dist
      env: '{"SITE_BASE": "/${{ github.event.repository.name }}"}'
      # The Releases page and the Status page (releases/, status/ and their data/*.json), at deploy time
      roadmap: docs/ROADMAP.md
      group: "@mark1russell7/packing"
      packages: "@mark1russell7/packing"
      site-name: packing
      deploy: ${{ github.event_name != 'pull_request' }}
      site-check: true
      site-check-pages: /,/explorer/,/compare/,/results/,/releases/,/status/
      site-check-probe: packages/site/src/check-probe.ts
