# The bench of roadmap item k97 (docs/BENCH.md, "Groups as near rectangles"). It measures the density of the groups against one box
# for each shape, on a made-up family and on the public instances of raster-nofit.yml, and the time of the pair search at 100 items.
# The instance files stay out of this repository: the job fetches them at a pinned commit. The numbers are in the artifact.
name: Near rects

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "The seeds of the made-up family, 1 to 200."
        type: string
        default: "30"
      count:
        description: "The items of each made-up input, 2 to 400."
        type: string
        default: "40"

permissions:
  contents: read

# The group has the inputs, so only a true duplicate waits behind a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.seeds }}-${{ inputs.count }}
  cancel-in-progress: false

env:
  SPARROW_COMMIT: 6067f007f02758b1a477be51b5a03a2f72db298b

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEEDS: ${{ inputs.seeds }}
      COUNT: ${{ inputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the inputs
        run: |
          [[ "$SEEDS" =~ ^[0-9]+$ ]] && [ "$SEEDS" -ge 1 ] && [ "$SEEDS" -le 200 ] || { echo "seeds must be a whole number from 1 to 200"; exit 1; }
          [[ "$COUNT" =~ ^[0-9]+$ ]] && [ "$COUNT" -ge 2 ] && [ "$COUNT" -le 400 ] || { echo "count must be a whole number from 2 to 400"; exit 1; }
      - name: Fetch the instances at the pinned commit
        run: |
          mkdir -p "$RUNNER_TEMP/instances"
          for name in albano dagli fu jakobs1 jakobs2 mao marques shapes0 shapes1 shirts swim trousers; do
            curl -fsSL "https://raw.githubusercontent.com/JeroenGar/sparrow/$SPARROW_COMMIT/data/input/$name.json" -o "$RUNNER_TEMP/instances/$name.json"
          done
      - name: Measure
        working-directory: packages/packing
        run: |
          mkdir -p "$RUNNER_TEMP/near-rects"
          node bench/near-rects.ts --out "$RUNNER_TEMP/near-rects/near-rects.json" --instances "$RUNNER_TEMP/instances" --seeds "$SEEDS" --count "$COUNT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: near-rects
          path: ${{ runner.temp }}/near-rects
          if-no-files-found: error
