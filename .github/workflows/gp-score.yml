# The bench of roadmap item k83 (docs/BENCH.md, "The evolved place score"). It searches for a place score of maxrects on
# generated strips, chooses one on validation seeds, and reads the held-out inputs of pack-strip-v1 once.
name: GP score

on:
  workflow_dispatch:
    inputs:
      population:
        description: "The trees of each generation, 8 to 512."
        type: string
        default: "400"
      generations:
        description: "The generations of each search, 1 to 500."
        type: string
        default: "100"
      runs:
        description: "The searches, each with its own seed, 1 to 20."
        type: string
        default: "10"

permissions:
  contents: read

# The group has the inputs, so only a true duplicate waits behind a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.population }}-${{ inputs.generations }}-${{ inputs.runs }}
  cancel-in-progress: false

# The shell bash has pipefail, so a failure before a tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      POPULATION: ${{ inputs.population }}
      GENERATIONS: ${{ inputs.generations }}
      RUNS: ${{ inputs.runs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the inputs
        run: |
          [[ "$POPULATION" =~ ^[0-9]+$ ]] && [ "$POPULATION" -ge 8 ] && [ "$POPULATION" -le 512 ] || { echo "population out of range"; exit 1; }
          [[ "$GENERATIONS" =~ ^[0-9]+$ ]] && [ "$GENERATIONS" -ge 1 ] && [ "$GENERATIONS" -le 500 ] || { echo "generations out of range"; exit 1; }
          [[ "$RUNS" =~ ^[0-9]+$ ]] && [ "$RUNS" -ge 1 ] && [ "$RUNS" -le 20 ] || { echo "runs out of range"; exit 1; }
      - name: Measure
        working-directory: packages/packing
        run: |
          mkdir -p "$RUNNER_TEMP/gp-score"
          node bench/gp-score.ts --out "$RUNNER_TEMP/gp-score/gp-score.json" --population "$POPULATION" --generations "$GENERATIONS" --runs "$RUNS" | tee "$RUNNER_TEMP/gp-score/summary.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gp-score
          path: ${{ runner.temp }}/gp-score
