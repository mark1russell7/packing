# The time gates of bench/gates in CI (k130). ci.yml uses this workflow, so the check CI OK of the ruleset needs it.
# The job changes examines the changed files of a pull request. The job gate runs only when a file that changes the
# time of a gate changed. A push or a release does not repeat it: the pull request of the change ran it.
# The job gate makes one job of the paired time test with the settings of the gate record, and applies the gate.
# The gate k130-time is one job of 3750 children, 20 to 34 minutes (run 41470082104).
# A run with an A/A noise above the noise cap of its gate cannot decide. The job retry then runs the gate one more time
# on a fresh runner, and a second noisy run fails. On each other verdict, the job retry only reads the verdict.
name: Time gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: time-gate-${{ github.ref }}
  # ci.yml calls this workflow on a push to main too, so only a pull request cancels a run in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Examine the changed files
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A manual run of this file always runs the gate
          if [ "$EVENT" = workflow_dispatch ] && [ "$WORKFLOW" = "Time gate" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != pull_request ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "A push or a release does not repeat the time gate. The pull request of the change ran it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The files of the portfolio around its members, the time tools, the time gate records and the lock file.
          # The record bench/gates/size.json of the size gate is not a time gate, so it does not start this job.
          files="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          if grep -qxE 'packages/packing/src/(portfolio|layout-input|measures|registry|select-key|work|contract)\.ts|packages/packing/bench/(paired-time|time-gate|time-gate-run|gate-flip|run|entries|main)\.ts|packages/packing/bench/time-gate\.sh|packages/packing/bench/gates/[a-z0-9-]+-time\.json|pnpm-lock\.yaml|\.github/workflows/time-gate\.yml' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No file of the time gates changed, so the job gate is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  gate:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    name: gate (${{ matrix.gate }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # repeats: the rounds of the runs of the derivation of each gate
        include:
          - gate: k130-time
            repeats: "3"
    env:
      GATE: ${{ matrix.gate }}
      REPEATS: ${{ matrix.repeats }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run the paired time test of the gate and apply the gate
        id: gate
        env:
          OUT: ${{ runner.temp }}/paired-time
        run: |
          status=0
          node packages/packing/bench/time-gate-run.ts || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # A noisy run cannot decide: the job retry starts one more run on a fresh runner.
          if [ "$status" = 3 ]; then
            echo "The A/A noise of the run is above the noise cap. The job retry decides." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
      # The flip test reads a copy of the files of a run with a pass, so a noisy run reads it in the job retry
      - name: Flip test of the time gate
        if: ${{ steps.gate.outputs.status == '0' }}
        env:
          OUT: ${{ runner.temp }}/paired-time
        run: |
          node packages/packing/bench/gate-flip.ts time --gate "packages/packing/bench/gates/$GATE.json" --dir "$OUT" --out "$RUNNER_TEMP/time-flip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: time-gate-${{ matrix.gate }}
          path: ${{ runner.temp }}/paired-time
          if-no-files-found: error

  retry:
    needs: [changes, gate]
    if: ${{ always() && needs.changes.outputs.run == 'true' && needs.gate.result == 'success' }}
    name: retry (${{ matrix.gate }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # repeats: the rounds of the runs of the derivation of each gate
        include:
          - gate: k130-time
            repeats: "3"
    env:
      GATE: ${{ matrix.gate }}
      REPEATS: ${{ matrix.repeats }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: time-gate-${{ matrix.gate }}
          path: ${{ runner.temp }}/first
      - name: Read the verdict of the first run
        id: first
        env:
          FIRST: ${{ runner.temp }}/first
        run: |
          verdict="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).verdict)' "$FIRST/gate.json")"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "The verdict of the first run of $GATE is $verdict." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.first.outputs.verdict == 'cannot-decide' }}
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.first.outputs.verdict == 'cannot-decide' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.first.outputs.verdict == 'cannot-decide' }}
        with:
          node-version: 26
      - name: Install
        if: ${{ steps.first.outputs.verdict == 'cannot-decide' }}
        run: pnpm install --frozen-lockfile
      - name: Run the gate a second time, and fail a second noisy run
        if: ${{ steps.first.outputs.verdict == 'cannot-decide' }}
        env:
          OUT: ${{ runner.temp }}/paired-time
          RETRY: "1"
        run: node packages/packing/bench/time-gate-run.ts
      - name: Flip test of the time gate
        if: ${{ steps.first.outputs.verdict == 'cannot-decide' }}
        env:
          OUT: ${{ runner.temp }}/paired-time
        run: |
          node packages/packing/bench/gate-flip.ts time --gate "packages/packing/bench/gates/$GATE.json" --dir "$OUT" --out "$RUNNER_TEMP/time-flip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.first.outputs.verdict == 'cannot-decide' }}
        with:
          name: time-gate-${{ matrix.gate }}-retry
          path: ${{ runner.temp }}/paired-time
          if-no-files-found: error
