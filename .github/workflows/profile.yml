# The CPU profile of roadmap item k64 (docs/BENCH.md, "A CPU profile"). The job downloads the time records of an earlier
# promotion.yml run, picks the inputs with the highest time ratio, and packs them with the strategy under the V8 profiler.
# It keeps the .cpuprofile file and the tables as the artifact profile-<strategy>, and it writes the tables to the job summary.
name: Profile

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: The corpus of the time records. The job packs its inputs again.
        required: true
        default: pack-screen-v1
      strategy:
        description: The id of the entry to profile
        required: true
        default: maxrects-bl
      times_run:
        description: The run id of a promotion.yml run. Its artifact promotion-time-<strategy> gives the time records.
        required: true
        default: "40683546461"
      slowest:
        description: The count of the inputs with the highest time ratio
        required: false
        default: "20"
      rank:
        description: The order of the slowest inputs, ratio (to rows) or ms (the time of the strategy)
        required: false
        default: ratio

permissions:
  contents: read

# The runner budget of the account (strategist, 2026-10-30). The group has the inputs, so only a true duplicate replaces a run that waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.corpus }}-${{ inputs.strategy }}
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      CORPUS: ${{ inputs.corpus || 'pack-screen-v1' }}
      STRATEGY: ${{ inputs.strategy || 'maxrects-bl' }}
      TIMES_RUN: ${{ inputs.times_run || '40683546461' }}
      SLOWEST: ${{ inputs.slowest || '20' }}
      RANK: ${{ inputs.rank || 'ratio' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # bench/profile.ts imports @mark1russell7/layout-contract at run time
      - run: pnpm install --frozen-lockfile
      - name: Check the inputs
        run: |
          [[ "$CORPUS" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo "corpus must be a-z, 0-9, dot and hyphen, not '$CORPUS'"; exit 1; }
          [ -f "packages/packing/bench/corpora/$CORPUS.json" ] || { echo "packages/packing/bench/corpora/$CORPUS.json does not exist"; exit 1; }
          [[ "$STRATEGY" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "strategy must be a-z, 0-9 and hyphen, not '$STRATEGY'"; exit 1; }
          [[ "$TIMES_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "times_run must be a run id, not '$TIMES_RUN'"; exit 1; }
          [[ "$SLOWEST" =~ ^[1-9][0-9]*$ ]] || { echo "slowest must be a number of 1 or more, not '$SLOWEST'"; exit 1; }
          [[ "$RANK" == ratio || "$RANK" == ms ]] || { echo "rank must be ratio or ms, not '$RANK'"; exit 1; }
          node packages/packing/bench/main.ts list --strategies "$STRATEGY,rows"
      - name: Download the time records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$TIMES_RUN" -R "$GITHUB_REPOSITORY" -n "promotion-time-$STRATEGY" -D "$RUNNER_TEMP/time"
      - name: Profile the slowest inputs
        working-directory: packages/packing
        run: |
          node bench/profile.ts --corpus "$CORPUS" --strategy "$STRATEGY" --default rows \
            --slowest "$SLOWEST" --rank "$RANK" --times "$RUNNER_TEMP/time" --repeats 3 --warmup 1 --out "$RUNNER_TEMP/profile"
      # V8 gives the samples of an inlined function to its caller. Without inlining, each function keeps its own samples.
      - name: Profile the slowest inputs without inlining
        working-directory: packages/packing
        run: |
          node --no-turbo-inlining --no-maglev-inlining bench/profile.ts --corpus "$CORPUS" --strategy "$STRATEGY" --default rows \
            --slowest "$SLOWEST" --rank "$RANK" --times "$RUNNER_TEMP/time" --repeats 3 --warmup 1 --out "$RUNNER_TEMP/profile/no-inlining"
      - name: Write the tables to the job summary
        if: ${{ !cancelled() }}
        run: |
          cpu="$(node -p 'const c = require("node:os").cpus(); `${c.length} x ${c[0].model.trim()}`')"
          echo "The time records come from the artifact \`promotion-time-$STRATEGY\` of run $TIMES_RUN. The runner has $cpu." >> "$GITHUB_STEP_SUMMARY"
          for md in "$RUNNER_TEMP/profile/profile.md" "$RUNNER_TEMP/profile/no-inlining/profile.md"; do
            if [ -f "$md" ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              cat "$md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: profile-${{ env.STRATEGY }}
          path: ${{ runner.temp }}/profile
          if-no-files-found: error
