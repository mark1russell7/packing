# The speed claims of k124 (relax), k125 (force) and k80 (overlap-min), measured again as paired time tests (docs/BENCH.md,
# "The speed claims"). One dispatch starts a matrix: each claim on the corpus of its old bench record and on a second corpus,
# and each pair in 5 jobs. Each job starts `bench/main.ts paired` in mode fresh with the A/A arm, as paired-time.yml does.
# The workflow only times. The ratio of a claim is the median over the inputs of the time of the arm over the time of its member.
name: Claims time

on:
  workflow_dispatch:
    inputs:
      prediction:
        description: "The id of the prediction of the runs."
        type: string
        default: packing-k124-k125-k80-time
      repeats:
        description: "The rounds of each job."
        type: string
        default: "5"

permissions:
  contents: read

# The runner budget of the account (2026-10-30). Only a true duplicate replaces a run that waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.prediction }}-${{ inputs.repeats }}
  cancel-in-progress: false

jobs:
  paired-time:
    name: paired-time (${{ matrix.claim }}, ${{ matrix.corpus }}, run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        claim: [k124, k125, k80]
        role: [first, second]
        run: [1, 2, 3, 4, 5]
        include:
          - { claim: k124, role: first, corpus: pack-screen-v1, arms: "rows,relax-rows,maxrects-bl,relax-maxrects-bl,skyline-bl-waste,relax-skyline-bl-waste" }
          - { claim: k124, role: second, corpus: pack-select-v2, arms: "rows,relax-rows,maxrects-bl,relax-maxrects-bl,skyline-bl-waste,relax-skyline-bl-waste" }
          - { claim: k125, role: first, corpus: pack-screen-v1, arms: "rows,force-rows,maxrects-bl,force-maxrects-bl,skyline-bl-waste,force-skyline-bl-waste" }
          - { claim: k125, role: second, corpus: pack-select-v2, arms: "rows,force-rows,maxrects-bl,force-maxrects-bl,skyline-bl-waste,force-skyline-bl-waste" }
          # overlap-min packs only free-height strips, and pack-select-v2 has none. So the second corpus of k80 is pack-strip-v1.
          - { claim: k80, role: first, corpus: pack-classes-v1, arms: "maxrects-bl,overlap-min-maxrects-bl-k8192,skyline,overlap-min-skyline-k8192,restarts-maxrects-bl-k16" }
          - { claim: k80, role: second, corpus: pack-strip-v1, arms: "maxrects-bl,overlap-min-maxrects-bl-k8192,skyline,overlap-min-skyline-k8192,restarts-maxrects-bl-k16" }
    env:
      ARMS: ${{ matrix.arms }}
      CORPUS: ${{ matrix.corpus }}
      PREDICTION: ${{ inputs.prediction }}
      REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run the paired time test
        run: |
          [[ "$PREDICTION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "prediction must be A-Z, a-z, 0-9, dot, underscore and hyphen, not '$PREDICTION'"; exit 1; }
          [[ "$REPEATS" =~ ^[1-9][0-9]*$ ]] || { echo "repeats must be a number of 1 or more, not '$REPEATS'"; exit 1; }
          out="$RUNNER_TEMP/paired-time"
          node packages/packing/bench/main.ts paired --corpus "$CORPUS" --arms "$ARMS" --prediction "$PREDICTION" \
            --mode fresh --repeats "$REPEATS" --warmup 2 --passes 1 --commit "$GITHUB_SHA" --out "$out"
          cat "$out/paired-time.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: claims-time-${{ matrix.claim }}-${{ matrix.corpus }}-run${{ matrix.run }}
          path: ${{ runner.temp }}/paired-time
          if-no-files-found: error
