# The check of the output rows of the catalog (k150, docs/BENCH.md "The output rows"). ci.yml uses this workflow, so the check
# CI OK of the ruleset needs it. The job reads each option set of each strategy on the family of whole-number inputs. It fails
# when a count differs from src/strategy-output.ts, and the failure names the strategy, the option set and the first input.
# The job reads no changed files, so no path list can miss a strategy.
# The job tie-move holds the table of the tie moves (k149, docs/BENCH.md "The tie moves") in the same way.
name: Output rows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare the read with the table
        working-directory: packages/packing
        env:
          OUT: ${{ runner.temp }}/output-rows
        run: node --no-warnings bench/whole-positions.ts --check --out "$OUT"
      # The output fingerprints (k201, docs/BENCH.md "The output fingerprints"): the hash of each strategy on the probe inputs.
      # The artifact holds the table of the read and the hash of each probe, so a changed fingerprint names its probes.
      - name: Compare the fingerprints with the table
        if: ${{ !cancelled() }}
        working-directory: packages/packing
        env:
          OUT: ${{ runner.temp }}/output-rows/fingerprints
        run: node --no-warnings bench/fingerprints.ts --check --out "$OUT"
      # A clean read of a strategy with whole rows, then the same read with half a position and with half a size. Each fault fails the check.
      - name: Flip test of the check
        working-directory: packages/packing
        env:
          OUT: ${{ runner.temp }}/output-rows/flip
        run: node --no-warnings bench/gate-flip.ts output --strategy rows --out "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: output-rows
          path: ${{ runner.temp }}/output-rows
          retention-days: 90
          if-no-files-found: error

  tie-move:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare the read with the table
        working-directory: packages/packing
        env:
          OUT: ${{ runner.temp }}/tie-move
        run: node --no-warnings bench/tie-move.ts --check --out "$OUT"
      # A clean read of one strategy, then the same read with a move of 100 on each change. The fault fails the check.
      - name: Flip test of the check
        working-directory: packages/packing
        env:
          OUT: ${{ runner.temp }}/tie-move/flip
        run: node --no-warnings bench/gate-flip.ts tie --strategy rows --out "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: tie-move
          path: ${{ runner.temp }}/tie-move
          retention-days: 90
          if-no-files-found: error
