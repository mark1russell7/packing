# The check of the output rows of the catalog (k150, docs/BENCH.md "The output rows"). ci.yml uses this workflow, so the check
# CI OK of the ruleset needs it. The job reads each option set of each strategy on the family of whole-number inputs. It fails
# when a count differs from src/strategy-output.ts, and the failure names the strategy, the option set and the first input.
# The job reads no changed files, so no path list can miss a strategy.
name: Output rows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare the read with the table
        working-directory: packages/packing
        env:
          OUT: ${{ runner.temp }}/output-rows
        run: node --no-warnings bench/whole-positions.ts --check --out "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: output-rows
          path: ${{ runner.temp }}/output-rows
          retention-days: 90
          if-no-files-found: error
